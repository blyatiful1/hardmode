# fable-mem privacy patterns  (installed to ~/.claude/memory/privacy.toml if absent)
#
# WHY: the promotion boundary is project -> global memory. A "work marker" is any
# token that must never cross into the machine-wide global corpus (`~/.claude/memory/`)
# — internal ticket ids, private hostnames, client/codenames. Two consumers read this:
#   * pretool-mem-privacy-guard.py  — BLOCKS a write into $BASE/memory/ whose pending
#                                     content matches any pattern (deterministic gate).
#   * `mem.py doctor --privacy`      — detective sweep over the whole global corpus.
#
# PATTERN SYNTAX: each entry is a work-marker glob. `*` matches a run of non-space
# characters; everything else is a literal substring, matched anywhere in the file.
#   "ACME-*"               -> matches ACME-1234, ACME-TICKET, ...
#   "internal.example.com" -> matches that hostname verbatim
#
# This list is CONSERVATIVE by design (necessary, not sufficient): it ships EMPTY so a
# fresh install never false-positives. Uncomment/extend with YOUR real markers.

patterns = [
