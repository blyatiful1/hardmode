# hardmode memory privacy patterns
#
# WHY: memory is written once and read by every future session. Two things must
# never land there: SECRETS (keys, tokens) and WORK MARKERS that must not cross from a
# project into the machine-wide corpus (internal ticket ids, private hostnames, client
# codenames). The pretool-mem-privacy-guard hook BLOCKS a Write/Edit into a memory
# corpus whose pending content matches any pattern below.
#
# WHICH FILE IS READ: <config dir>/memory/privacy.toml if it exists (your own list —
# `python3 tools/doctor.py --init-privacy` copies this one there), else this shipped
# file. The first readable non-empty list wins; they are not merged.
#
# PATTERN SYNTAX: `*` matches a run of non-space characters; everything else is a
# literal substring, matched anywhere in the pending text (case-sensitive).
#   "ACME-*"               -> ACME-1234, ACME-TICKET, ...
#   "internal.example.com" -> that hostname verbatim
#
# The shipped defaults are SECRET-SHAPED: private-key headers and the well-known
# API-token prefixes. They essentially never false-positive on prose, so a fresh
# install is armed. Add YOUR work markers below them.

patterns = [
  # secrets (shipped defaults)
  "PRIVATE KEY-----",
  "AKIA*",
  "ghp_*",
  "github_pat_*",
  "gho_*",
  "sk-ant-*",
  "sk-proj-*",
  "xoxb-*",
  "xoxp-*",
  "AIza*",
  "-----BEGIN OPENSSH",
  # your work markers (examples — uncomment/extend)
  # "ACME-*",
  # "internal.example.com",
  # "PROJECT-CODENAME",
  # "*.corp.internal",
]
